name: Verify Crowsi authority transport
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Verify synthetic contracts and observation boundaries
        run: |
          cargo +1.97.1 test --locked --workspace --all-features
          cargo +1.97.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
